events {}

http {
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        server_name ilija-petrov.online www.ilija-petrov.online;
        listen 80;

        limit_req zone=req_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        location / {
            proxy_pass http://booking_app:8000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name ilija-petrov.online www.ilija-petrov.online;

        ssl_certificate /etc/letsencrypt/live/ilija-petrov.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ilija-petrov.online/privkey.pem;

        location / {
            proxy_pass http://booking_app:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

}